<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Into the Deep: Solo Run</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{--bg:#eaf1f0;--ink:#0d2b33;--mute:#4d6a70;--panel:#fff;--line:#bccfce;--accent:#0f7c8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a20;--ink:#e3f1ef;--mute:#8fb0b3;--panel:#0d2a33;--line:#1c4652;--accent:#3cc4d0}}
:root[data-theme="dark"]{--bg:#071a20;--ink:#e3f1ef;--mute:#8fb0b3;--panel:#0d2a33;--line:#1c4652;--accent:#3cc4d0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:500;font-size:18px}
.wrap{max-width:1180px;margin:0 auto;padding:10px 12px}
.sb{display:grid;grid-template-columns:1fr 150px 1fr;min-height:78px;border-radius:6px;overflow:hidden;color:#fff;margin-bottom:10px;font-variant-numeric:tabular-nums}
.sb>div{display:flex;align-items:center;gap:8px;padding:6px 12px}
.sb .b{background:#0f5fae}.sb .r{background:#d5232a;justify-content:flex-end}
.sb .m{background:#fff;color:#111;flex-direction:column;justify-content:center;gap:0}
#tm{font-size:46px;font-weight:700;line-height:1}#ph{font-size:17px;font-weight:700;color:#0f5fae;text-transform:uppercase}
.sn{font-size:44px;font-weight:700;line-height:1;min-width:64px;text-align:center}
.stat{background:rgba(255,255,255,.93);color:#111;border-radius:3px;min-width:44px;text-align:center;line-height:1.05;padding:2px 5px}
.stat small{display:block;font-size:11px;color:#555;text-transform:uppercase}.stat b{display:block;font-size:19px}
.lbl{font-size:16px;opacity:.85;text-transform:uppercase}
@media(max-width:640px){.sb{grid-template-columns:1fr 100px 1fr}.stat{min-width:34px;padding:1px 3px}.sn{font-size:32px;min-width:44px}#tm{font-size:32px}}
.main{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
@media(max-width:900px){.main{grid-template-columns:1fr}}
.stage{position:relative;width:100%}
canvas{display:block;width:100%;aspect-ratio:1000/620;border-radius:6px}
.st{display:flex;flex-wrap:wrap;gap:2px 18px;color:var(--mute);font-size:17px;margin-top:6px}
.st b{color:var(--ink);font-variant-numeric:tabular-nums}.st .bad b{color:#d9443a}
#hint{margin:4px 0 0;min-height:1.4em}
.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px}
.side h2{margin:0 0 4px;font-size:19px}
.side p{margin:6px 0 0;color:var(--mute);font-size:15px;line-height:1.25}
.kr{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:1px 0;font-size:16px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0 0 4px}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,20,26,.86);border-radius:6px;padding:12px}
.ov[hidden]{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;max-width:480px;width:100%;max-height:100%;overflow:auto}
.card h1{margin:0 0 6px;font-size:28px;line-height:1.05}
.card p,.card li{margin:4px 0;color:var(--mute);line-height:1.25}.card ul{padding-left:18px;margin:6px 0}.card b{color:var(--ink)}
.res{background:#c9262c;color:#fff;text-align:center;border-color:#c9262c}
.res .rh{font-size:20px;opacity:.9}.res .wh{background:#ffe600;color:#111;font-weight:700;border-radius:3px;margin:6px 0 2px;padding:1px 0}
.rs{font-size:84px;font-weight:700;line-height:1}
.res table{width:100%;border-collapse:collapse;margin:8px 0;color:#111}
.res td{background:#fff;padding:4px 10px;font-size:20px;font-weight:700}.res tr:nth-child(even) td{background:#e2e2e2}.res td+td{text-align:right}
@media (prefers-reduced-motion:no-preference){.rs{animation:fl .45s 7}}
@keyframes fl{50%{opacity:.1}}
button{font:inherit;font-weight:700;font-size:20px;background:var(--accent);color:#04181d;border:0;border-radius:6px;padding:8px 18px;cursor:pointer;margin-top:8px}
.kr button,#rk{font-size:15px;padding:1px 10px;margin:0;min-width:66px;background:transparent;color:var(--ink);border:1px solid var(--line)}
#rk{margin-top:6px}.kr button.on{background:var(--accent);color:#04181d;border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="sb">
    <div class="b"><div class="sn" id="bs">0</div><div class="lbl">Personal best</div></div>
    <div class="m"><div id="ph">Ready</div><div id="tm">2:30</div></div>
    <div class="r"><div class="lbl">Solo run</div>
      <div class="stat"><small>Net</small><b id="sN">0</b></div>
      <div class="stat"><small>Basket H/L</small><b id="sB">0</b><b id="sB2">0</b></div>
      <div class="stat"><small>Chamber H/L</small><b id="sC">0</b><b id="sC2">0</b></div>
      <div class="stat"><small>Ascent</small><b id="sA">0</b></div>
      <div class="sn" id="sc">0</div></div>
  </div>
  <div class="main">
    <div>
      <div class="stage"><canvas id="c" width="1000" height="620"></canvas><div class="ov" id="ov"></div></div>
      <div class="st"><span>Holding <b id="hd"></b></span><span>Lift <b id="lf"></b></span><span id="rc">Length <b id="rb"></b></span><span>Drive <b id="dm"></b></span><span>Human player <b id="hp"></b></span></div>
      <p id="hint"></p>
    </div>
    <div>
      <div class="side"><h2>Controls</h2><div id="kb"></div><button id="rk">Reset keys</button><p>Click a key, then press its new key (Esc cancels). Gamepad: left stick drive, right stick turn and lift, triggers extend, A score, B climb, Y drive mode.</p></div>
      <div class="side"><h2>Speeds</h2><div id="sl"></div></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id),C=$('c'),g=C.getContext('2d'),F=144,FN='"Barlow Condensed",sans-serif';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// Point values follow the ones you gave me; auto and teleop use the same table. Verify the rest in the Game Manual.
const PTS={net:2,low:4,high:8,sl:6,sh:10,asc:[0,3,15,30],park:3};
const LIM={body:18,len:42,height:42,bHi:43,bLo:25,cHi:26,cLo:14};
const OBS=[[144,0],[131,0],[131,24],[144,36]],NET=[[144,144],[122,144],[144,122]],ASC=[[48,88],[48,97],[72,107],[96,97],[96,88]];
const SLOTS=[[141,6],[141,14],[141,22]];
const COL={y:[242,194,48],r:[217,68,58],b:[61,111,208]};
const ACT=[['fwd','Drive forward'],['back','Drive back'],['left','Strafe left'],['right','Strafe right'],['tl','Turn left'],['tr','Turn right'],['up','Lift up'],['dn','Lift down'],['out','Extend out'],['in','Retract'],['act','Score / drop'],['climb','Climb (endgame)'],['cam','Rotate view'],['mode','Drive mode']];
const DEF={fwd:'KeyW',back:'KeyS',left:'KeyA',right:'KeyD',tl:'KeyQ',tr:'KeyE',up:'ArrowUp',dn:'ArrowDown',out:'ArrowRight',in:'ArrowLeft',act:'Space',climb:'KeyF',cam:'KeyV',mode:'KeyC'};
const SL=[['drive','Drive speed',20,70],['lift','Lift speed',10,60],['ext','Extension speed',10,60]];
let B={...DEF},ST={drive:55,lift:30,ext:30},bind=null,S,K={},padA=0,padB=0,padY=0,padOff=false,msgT=0,msgS='',cam=1;
try{Object.assign(B,JSON.parse(localStorage.getItem('itd-keys')||'{}'));Object.assign(ST,JSON.parse(localStorage.getItem('itd-set')||'{}'))}catch(e){}
const store=(k,o)=>{try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}};
const kn=c=>({Space:'Space',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'}[c]||c.replace(/^(Key|Digit)/,''));
function keys(){$('kb').innerHTML=ACT.map(([a,l])=>`<div class="kr"><span>${l}</span><button data-a="${a}" class="${bind===a?'on':''}">${bind===a?'Press key':kn(B[a])}</button></div>`).join('')}
function sliders(){$('sl').innerHTML=SL.map(([k,l,a,b])=>`<div class="kr"><span>${l}</span><b id="v${k}">${ST[k]} in/s</b></div><input type="range" data-k="${k}" min="${a}" max="${b}" value="${ST[k]}">`).join('')}
$('kb').onclick=e=>{const a=e.target.dataset&&e.target.dataset.a;if(a){bind=a;keys();e.target.blur()}};
$('rk').onclick=()=>{B={...DEF};bind=null;store('itd-keys',B);keys()};
$('sl').oninput=e=>{const k=e.target.dataset.k;if(k){ST[k]=+e.target.value;$('v'+k).textContent=ST[k]+' in/s';store('itd-set',ST)}};
$('sl').onchange=e=>e.target.blur();
function pip(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[a,b]=p[i],[u,w]=p[j];if((b>y)!==(w>y)&&x<(u-a)*(y-b)/(w-b)+a)c=!c}return c}
const inAsc=(x,y)=>pip(x,y,ASC);
const ph=()=>S.t<30?0:S.t<38?1:S.t<128?2:3;
// ---- isometric projection: world inches (x,y,z) -> screen, viewer at one field corner (cam 0..3) ----
const AS=3.2,CX=500,CY=110;
const R=(x,y)=>{for(let i=0;i<cam;i++)[x,y]=[y,F-x];return[x,y]};
const Rv=(x,y)=>{for(let i=0;i<(4-cam)%4;i++)[x,y]=[y,-x];return[x,y]};
const P2=(u,v,z)=>[CX+(u-v)*AS,CY+(u+v)*AS*.5-z*AS*.9];
const P=(x,y,z=0)=>{const[u,v]=R(x,y);return P2(u,v,z)};
const rgb=(c,k)=>`rgb(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0})`;
function fillQ(p,f){g.beginPath();p.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=f;g.fill();g.strokeStyle='rgba(0,0,0,.28)';g.lineWidth=.8;g.stroke()}
const poly=(p,f,z=0)=>fillQ(p.map(([x,y])=>P(x,y,z)),f);
const pl=(c,w,...p)=>{g.strokeStyle=c;g.lineWidth=w;g.beginPath();p.forEach(([x,y],i)=>{const[X,Y]=P(x,y,0);i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()};
function OB(cx,cy,z,l,w,h,a,c){
  const co=Math.cos(a),si=Math.sin(a);
  const q=[[-l/2,-w/2],[l/2,-w/2],[l/2,w/2],[-l/2,w/2]].map(([p,r])=>R(cx+p*co-r*si,cy+p*si+r*co));
  for(let i=0;i<4;i++){const[x1,y1]=q[i],[x2,y2]=q[(i+1)%4],nx=y2-y1,ny=x1-x2;
    if(nx+ny>.01){const t=(nx-ny)/Math.hypot(nx,ny)/1.414;fillQ([P2(x1,y1,z),P2(x2,y2,z),P2(x2,y2,z+h),P2(x1,y1,z+h)],rgb(c,.72+.22*t))}}
  fillQ(q.map(([u,v])=>P2(u,v,z+h)),rgb(c,1.1));
}
function reset(){
  const it=[];
  [[48,[6,17,28],'y'],[96,[6,17,28],'r'],[48,[116,127,138],'b'],[96,[116,127,138],'y']].forEach(([x,ys,c])=>ys.forEach(y=>it.push({x,y,t:'s',c,a:0})));
  for(let i=0;i<18;i++)it.push({x:52+Math.random()*40,y:60+Math.random()*24,t:'s',c:'yrb'[i%3],a:Math.random()*3.14});
  S={t:0,score:0,run:false,over:false,field:true,stock:3,pend:0,clip:0,hpT:1,pops:[],items:it,cnt:{net:0,bh:0,bl:0,ch:0,cl:0,asc:0},cat:{auto:0,asc:0,tele:0},
    r:{x:108,y:132,a:-Math.PI/2,vx:0,vy:0,H:0,E:0,hold:'p',hc:'r',hang:false,stage:0,rise:0}};
}
const tip=()=>{const r=S.r,d=LIM.body/2+2+r.E;return[r.x+Math.cos(r.a)*d,r.y+Math.sin(r.a)*d]};
const say=t=>{msgS=t;msgT=2.8};
function add(p,l,k){S.score+=p;S.cat[k==='asc'?'asc':(S.t<30||k==='park')?'auto':'tele']+=p;if(k)S.cnt[k]=(S.cnt[k]||0)+1;S.pops.push({x:S.r.x,y:S.r.y,txt:'+'+p,life:1})}
function act(){
  const r=S.r;if(!S.run||S.over||r.hang||ph()===1)return;
  const[tx,ty]=tip(),eff=r.H+3;
  if(r.hold==='s'){
    const nb=Math.hypot(tx-136,ty-136)<14;
    if(nb&&eff>=LIM.bHi)add(PTS.high,'','bh');else if(nb&&eff>=LIM.bLo)add(PTS.low,'','bl');
    else if(pip(tx,ty,NET)&&r.H<20)add(PTS.net,'','net');
    else if(pip(tx,ty,OBS)&&r.H<20){S.items.push({x:tx,y:ty,t:'s',c:r.hc||'y',a:r.a+Math.PI/2,drop:S.t});say('Dropped. Your human player will clip it into a specimen.')}
    else return say(nb?'Too low for a basket. Raise the lift.':'Score at the baskets or net zone, or drop it in the observation zone for the human player.');
    r.hold=null;
  }else if(r.hold==='p'){
    if(tx>88&&tx<104&&ty>53&&ty<91){
      if(r.H>=LIM.cHi-4)add(PTS.sh,'','ch');else if(r.H>=LIM.cLo-4)add(PTS.sl,'','cl');else return say('Lift the specimen above a chamber bar first.');
      r.hold=null;
    }else say('Hang specimens on the red chamber, the right face of the submersible.');
  }
}
function climb(){
  const r=S.r;if(!S.run||S.over||ph()===1)return;
  if(ph()<3)return say('Ascent opens for the last 30 seconds.');
  if(!inAsc(r.x,r.y))return say('Drive into the ascent zone first, the white trapezoid below the submersible.');
  if(r.hold)return say('Score or drop your piece before climbing.');
  if(!r.hang){r.hang=true;r.stage=1;r.vx=r.vy=0}
  else if(r.stage===1&&r.rise>=7.5)r.stage=2;
  else if(r.stage===1)say('Let the first hang settle, then press again.');
}
function pad(){
  const o={x:0,y:0,rx:0,ly:0,ex:0};let p=null;
  if(padOff)return o;
  try{p=[...(navigator.getGamepads?navigator.getGamepads():[])].find(x=>x)}catch(e){padOff=true}
  if(!p)return o;
  const dz=v=>Math.abs(v)<.15?0:v,bv=i=>p.buttons[i]?p.buttons[i].value:0;
  o.x=dz(p.axes[0]||0);o.y=dz(p.axes[1]||0);o.rx=dz(p.axes[2]||0);o.ly=dz(p.axes[3]||0);o.ex=bv(7)-bv(6);
  const a=bv(0)>.5,b=bv(1)>.5,y=bv(3)>.5;if(a&&!padA)act();if(b&&!padB)climb();if(y&&!padY)S.field=!S.field;padA=a;padB=b;padY=y;return o;
}
addEventListener('keydown',e=>{
  if(bind){e.preventDefault();if(e.code!=='Escape'){const old=B[bind];for(const k in B)if(k!==bind&&B[k]===e.code)B[k]=old;B[bind]=e.code;store('itd-keys',B)}bind=null;keys();return}
  if(Object.values(B).includes(e.code)&&S.run)e.preventDefault();
  if(!e.repeat){if(e.code===B.cam)cam=(cam+1)%4;if(S.run){if(e.code===B.act)act();if(e.code===B.climb)climb();if(e.code===B.mode)S.field=!S.field}}K[e.code]=1;
});
addEventListener('keyup',e=>K[e.code]=0);
function update(dt){
  const r=S.r,p=pad(),dn=a=>K[B[a]]?1:0;S.t+=dt;
  if(!S.pk&&S.t>=30){S.pk=1;if(pip(r.x,r.y,OBS))add(PTS.park,'','park')}
  if(S.t>=158)return finish();
  // human player: takes dropped samples from the observation zone, clips them, and hangs them on the wall
  for(let i=S.items.length-1;i>=0;i--){const o=S.items[i];if(o.drop!=null&&S.t-o.drop>1.5){S.items.splice(i,1);S.pend++}}
  if(S.clip>0){S.clip-=dt;if(S.clip<=0)S.stock++}else if(S.pend>0){S.pend--;S.clip=3.5}
  S.hpT-=dt;
  if(S.hpT<=0&&S.stock>0){const s=SLOTS.find(([x,y])=>!S.items.some(i=>Math.hypot(i.x-x,i.y-y)<6));if(s){S.items.push({x:s[0],y:s[1],t:'p',c:'r',a:0,w:1});S.stock--;S.hpT=1}}
  if(ph()===1){r.vx=r.vy=0;return}
  if(r.hang){const k=Math.min(1,dt*3);r.rise+=clamp((r.stage===1?8:24)-r.rise,-8*dt,8*dt);r.H+=((r.stage===1?18:34)-r.H)*k;
    let da=-Math.PI/2-r.a;da=Math.atan2(Math.sin(da),Math.cos(da));r.a+=da*k;r.E+=(clamp(r.y-99.5,0,24)-r.E)*k;return}
  const lv=dn('up')-dn('dn')-p.ly,ex=dn('out')-dn('in')+p.ex;
  r.H=clamp(r.H+lv*ST.lift*dt,0,LIM.height);r.E=clamp(r.E+ex*ST.ext*dt,0,LIM.len-LIM.body);
  let fx=dn('right')-dn('left')+p.x,fy=dn('back')-dn('fwd')+p.y;
  const m=Math.hypot(fx,fy);if(m>1){fx/=m;fy/=m}
  let mx,my;const c=Math.cos(r.a),s=Math.sin(r.a);
  if(S.field)[mx,my]=Rv((fx+fy)/1.414,(fy-fx)/1.414);else{const f=-fy;mx=c*f-s*fx;my=s*f+c*fx}
  const sp=ST.drive*(1-.45*r.H/LIM.height),k=Math.min(1,dt*7);
  r.vx+=(mx*sp-r.vx)*k;r.vy+=(my*sp-r.vy)*k;
  r.a+=(dn('tr')-dn('tl')+p.rx)*3*dt*(1-.3*r.H/LIM.height);
  r.x=clamp(r.x+r.vx*dt,10,134);r.y=clamp(r.y+r.vy*dt,10,134);
  if(r.x>38&&r.x<106&&r.y>46&&r.y<98){const d=[r.x-38,106-r.x,r.y-46,98-r.y],i=d.indexOf(Math.min(...d));
    if(i===0)r.x=38;else if(i===1)r.x=106;else if(i===2)r.y=46;else r.y=98}
  if(!r.hold&&r.H<=10){const[tx,ty]=tip(),i=S.items.findIndex(o=>o.c!=='b'&&o.drop==null&&Math.hypot(o.x-tx,o.y-ty)<4.5);
    if(i>=0){const o=S.items[i];r.hold=o.t;r.hc=o.c;S.items.splice(i,1)}}
}
function finish(){
  const r=S.r,l=r.hang?(r.rise>=23?3:r.rise>=7?2:1):(inAsc(r.x,r.y)?1:0);
  if(l){add(PTS.asc[l],'','asc');S.cnt.asc=l}
  S.over=true;S.run=false;let prev=0;
  try{prev=+localStorage.getItem('itd-best')||0;if(S.score>prev)localStorage.setItem('itd-best',S.score)}catch(e){}
  const nb=S.score>prev&&S.score>0;if(nb)$('bs').textContent=S.score;
  show(`<div class="res card"><div class="rh">Match Results</div>${nb?'<div class="wh">★ Personal Best ★</div>':''}<div class="rs">${S.score}</div>
  <table><tr><td>Auto</td><td>${S.cat.auto}</td></tr><tr><td>Teleop Ascent</td><td>${S.cat.asc}</td></tr><tr><td>Other Teleop</td><td>${S.cat.tele}</td></tr><tr><td>Foul</td><td>0</td></tr></table>
  <button id="go">Run it again</button></div>`,true);
}
function show(h,raw){const o=$('ov');o.innerHTML=raw?h:'<div class="card">'+h+'</div>';o.hidden=false;$('go').onclick=start;$('go').focus()}
function start(){reset();S.run=true;$('ov').hidden=true}
function hpDraw(){
  const[X,Y]=P(152,15,0),c=S.clip>0;
  g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(X,Y,20,7,0,0,7);g.fill();
  g.fillStyle='#b32a22';g.beginPath();g.roundRect(X-13,Y-56,26,52,6);g.fill();
  g.fillStyle='#f0d2b4';g.beginPath();g.arc(X,Y-65,8.5,0,7);g.fill();
  if(c||S.stock>0){g.save();g.translate(X+17,Y-38);g.rotate(-.5);g.fillStyle='#d9443a';g.fillRect(-10,-3,20,6);g.fillStyle='#fff';g.fillRect(-2,-7,5,4);g.restore()}
  g.fillStyle='#fff';g.font='700 14px '+FN;g.textAlign='center';g.fillText('Human player',X,Y-82);
  if(c){g.fillStyle='rgba(255,255,255,.3)';g.fillRect(X-24,Y-78,48,4);g.fillStyle='#ffe600';g.fillRect(X-24,Y-78,48*(1-S.clip/3.5),4)}
}
function robot(){
